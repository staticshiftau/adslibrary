<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Video Script Frameworks - Static Shift Ads Library</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #1a1f2e;
            color: #1e293b;
            min-height: 100vh;
        }

        .top-bar {
            background: rgba(255, 255, 255, 0.95);
            padding: 16px 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .top-bar-inner {
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
        }

        .page-title {
            font-size: 20px;
            font-weight: 700;
        }

        .top-link {
            padding: 10px 16px;
            background: #667eea;
            color: white;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            white-space: nowrap;
        }

        .top-link:hover {
            background: #5568d3;
        }

        .page {
            max-width: 1100px;
            margin: 0 auto;
            padding: 24px 16px 64px;
        }

        .intro {
            color: #cbd5e1;
            font-size: 15px;
            line-height: 1.5;
            margin-bottom: 20px;
            max-width: 720px;
        }

        .media-filter {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 20px;
        }

        .media-filter-label {
            color: #cbd5e1;
            font-size: 14px;
            margin-right: 4px;
        }

        .media-filter-btn {
            padding: 8px 16px;
            background: transparent;
            color: #cbd5e1;
            border: 1px solid #475569;
            border-radius: 18px;
            font: inherit;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .media-filter-btn:hover {
            border-color: #94a3b8;
        }

        .media-filter-btn.active {
            background: #667eea;
            border-color: #667eea;
            color: white;
        }

        .media-filter-btn:focus-visible {
            outline: 3px solid #a5b4fc;
            outline-offset: 2px;
        }

        .ad-type {
            float: right;
            margin-left: 8px;
            padding: 2px 8px;
            background: #f1f5f9;
            color: #475569;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 600;
        }

        .status {
            padding: 40px 16px;
            text-align: center;
            color: #cbd5e1;
            font-size: 15px;
        }

        .framework {
            background: white;
            border-radius: 12px;
            margin-bottom: 12px;
            overflow: hidden;
        }

        .framework-toggle {
            width: 100%;
            display: flex;
            align-items: flex-start;
            gap: 14px;
            padding: 18px 20px;
            background: white;
            border: none;
            font: inherit;
            color: inherit;
            text-align: left;
            cursor: pointer;
        }

        .framework-toggle:hover {
            background: #f8fafc;
        }

        .framework-toggle:focus-visible {
            outline: 3px solid #667eea;
            outline-offset: -3px;
        }

        .framework-number {
            flex-shrink: 0;
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: #e0e7ff;
            color: #4338ca;
            font-weight: 700;
            font-size: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .framework-heading {
            flex: 1;
            min-width: 0;
        }

        .framework-title {
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .framework-job {
            font-size: 14px;
            color: #475569;
            line-height: 1.45;
        }

        .framework-meta {
            margin-top: 8px;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .chip {
            display: inline-block;
            padding: 3px 10px;
            background: #f1f5f9;
            color: #475569;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .chip.ads {
            background: #e0e7ff;
            color: #4338ca;
        }

        .framework-chevron {
            flex-shrink: 0;
            color: #64748b;
            font-size: 14px;
            margin-top: 12px;
            transition: transform 0.2s;
        }

        .framework.open .framework-chevron {
            transform: rotate(90deg);
        }

        .framework-body {
            display: none;
            padding: 4px 20px 24px;
            border-top: 1px solid #e2e8f0;
        }

        .framework.open .framework-body {
            display: block;
        }

        .section-title {
            font-size: 13px;
            font-weight: 700;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin: 20px 0 10px;
        }

        .facts {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
            margin-top: 16px;
        }

        .fact {
            background: #f8fafc;
            border-radius: 8px;
            padding: 12px 14px;
        }

        .fact-label {
            font-size: 12px;
            font-weight: 600;
            color: #64748b;
            margin-bottom: 4px;
        }

        .fact-value {
            font-size: 14px;
            line-height: 1.45;
        }

        /* The table scrolls inside its own box, so the page never scrolls sideways */
        .beats-scroll {
            overflow-x: auto;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
        }

        .beats {
            width: 100%;
            min-width: 560px;
            border-collapse: collapse;
            font-size: 14px;
            line-height: 1.45;
        }

        .beats th {
            background: #f1f5f9;
            text-align: left;
            font-size: 12px;
            font-weight: 700;
            color: #475569;
            padding: 10px 12px;
        }

        .beats td {
            padding: 10px 12px;
            border-top: 1px solid #e2e8f0;
            vertical-align: top;
        }

        .beats td:first-child {
            white-space: nowrap;
            color: #475569;
            font-variant-numeric: tabular-nums;
        }

        .held-note {
            margin-top: 8px;
            font-size: 12px;
            color: #64748b;
        }

        .ads {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 14px;
        }

        .ad {
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            overflow: hidden;
            background: white;
        }

        .ad-head {
            padding: 12px 14px;
        }

        .ad-brand {
            font-size: 14px;
            font-weight: 700;
        }

        .ad-headline {
            font-size: 13px;
            color: #475569;
            margin-top: 4px;
            line-height: 1.4;
            overflow-wrap: anywhere;
        }

        .winner-badge {
            display: inline-block;
            margin-top: 8px;
            padding: 3px 8px;
            background: #b45309;
            color: white;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 700;
        }

        .winner-note {
            margin-top: 6px;
            font-size: 12px;
            color: #78350f;
            overflow-wrap: anywhere;
        }

        .ad-media {
            background: #f0f2f5;
        }

        .ad-media iframe,
        .ad-media video {
            display: block;
            width: 100%;
            height: 480px;
            border: none;
        }

        .ad-media img {
            display: block;
            width: 100%;
            height: auto;
        }

        .ad-media .no-media {
            padding: 40px 16px;
            text-align: center;
            color: #64748b;
            font-size: 13px;
        }

        .ad-foot {
            padding: 10px 14px 14px;
        }

        .transcript-toggle {
            background: none;
            border: none;
            font: inherit;
            font-size: 13px;
            font-weight: 600;
            color: #4338ca;
            cursor: pointer;
            padding: 4px 0;
        }

        .transcript {
            display: none;
            margin-top: 8px;
            padding: 10px 12px;
            background: #f8fafc;
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.5;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .transcript.open {
            display: block;
        }

        .ad-link {
            display: inline-block;
            margin-top: 8px;
            font-size: 13px;
            font-weight: 600;
            color: #4338ca;
        }

        .empty {
            padding: 20px 16px;
            background: #f8fafc;
            border-radius: 8px;
            font-size: 14px;
            color: #64748b;
        }

        @media (max-width: 600px) {
            .top-bar {
                padding: 12px 16px;
            }

            .page-title {
                font-size: 17px;
            }

            .framework-toggle {
                padding: 14px;
                gap: 10px;
            }

            .framework-body {
                padding: 4px 14px 20px;
            }

            .facts {
                grid-template-columns: 1fr;
            }

            .ads {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <div class="top-bar-inner">
            <h1 class="page-title">Video Script Frameworks</h1>
            <a class="top-link" href="index.html">← Ads Library</a>
        </div>
    </div>

    <main class="page">
        <p class="intro">The structures we write video ads on. Open one to see its beats, then the real ads it came from.</p>
        <div class="media-filter" role="group" aria-label="Show ads by type">
            <span class="media-filter-label">Show ads:</span>
            <button class="media-filter-btn active" data-media="all" aria-pressed="true" onclick="setMediaFilter(this.dataset.media)">All</button>
            <button class="media-filter-btn" data-media="video" aria-pressed="false" onclick="setMediaFilter(this.dataset.media)">Video</button>
            <button class="media-filter-btn" data-media="image" aria-pressed="false" onclick="setMediaFilter(this.dataset.media)">Image</button>
        </div>
        <div id="frameworks"><div class="status">Loading frameworks...</div></div>
    </main>

    <script>
        // This page shares a few helpers with index.html (escaping, Drive links, media markup).
        // They are copied, not shared: a change to how creatives render has to be made in both files.
        const CONFIG = {
            spreadsheetId: '1nY2bWQfArOSVuJycBQdEL2VP1UgGFiLzglxPmIIHXaw',
            apiKey: 'AIzaSyCUReqio38YB172WFZeFhS-hetFwYoT9CE',  // restricted: Sheets API only, staticshiftau.github.io referrer only
            sheetName: 'Ads Library',
            range: 'A:AB'
        };

        // The Sheets API key only works from staticshiftau.github.io. On a local preview the page
        // reads dev-fixture.json instead (a dump of the sheet, never committed).
        const IS_LOCAL = ['localhost', '127.0.0.1'].includes(location.hostname);

        let frameworks = [];
        let ads = null;        // null until the sheet has loaded
        let adsError = false;

        function escapeHtml(value) {
            return String(value == null ? '' : value)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        // Only http(s) links are ever put into an href or src
        function safeUrl(value) {
            const url = String(value == null ? '' : value).trim();
            return /^https?:\/\//i.test(url) ? escapeHtml(url) : '';
        }

        // Escapes first, then turns **bold** from the cards into bold. Any stray asterisk is dropped.
        function richText(value) {
            return escapeHtml(value).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/\*/g, '');
        }

        function getGoogleDriveFileId(url) {
            if (!url) return null;
            const driveMatch = url.match(/drive\.google\.com\/file\/d\/([^\/]+)/);
            return driveMatch ? driveMatch[1] : null;
        }

        function isWinner(ad) {
            return (ad['Confirmed Winner'] || '').trim() === 'Yes';
        }

        // A Structure cell holds one or more cards, separated by semicolons: "07 Displacement, then STOP; 04 STOP-prescription"
        function adsFor(number) {
            if (!ads) return [];
            return ads.filter(ad => (ad['Structure'] || '').split(';')
                .some(part => (part.trim().match(/^\d{2}/) || [''])[0] === number))
                .filter(ad => mediaFilter === 'all' || mediaKind(ad) === mediaFilter);
        }

        // 'video' or 'image'. Carousels and statics both count as image.
        let mediaFilter = 'all';

        function mediaKind(ad) {
            const type = (ad['Ad Type'] || '').trim().toLowerCase();
            return (type === 'video' || (ad['Video URL'] || '').trim()) ? 'video' : 'image';
        }

        function countLabel(count) {
            const kind = mediaFilter === 'all' ? '' : mediaFilter + ' ';
            return `${count} ${kind}${count === 1 ? 'ad' : 'ads'}`;
        }

        // Changes which ads show, without closing any framework that is open
        function setMediaFilter(kind) {
            if (!['all', 'video', 'image'].includes(kind)) return;
            mediaFilter = kind;
            document.querySelectorAll('.media-filter-btn').forEach(button => {
                const on = button.dataset.media === kind;
                button.classList.toggle('active', on);
                button.setAttribute('aria-pressed', on ? 'true' : 'false');
            });
            document.querySelectorAll('.framework').forEach(section => {
                const framework = frameworks.find(f => f.number === section.dataset.number);
                if (!framework) return;
                const chip = section.querySelector('.chip.ads');
                if (chip) chip.textContent = countLabel(adsFor(framework.number).length);
                const adsBox = section.querySelector('.framework-ads');
                if (adsBox) adsBox.innerHTML = adsSectionHtml(framework);
            });
        }

        async function loadFrameworks() {
            const response = await fetch('frameworks.json', { cache: 'no-cache' });
            if (!response.ok) throw new Error('frameworks.json answered ' + response.status);
            const data = await response.json();
            if (!data || !Array.isArray(data.frameworks)) throw new Error('frameworks.json has no frameworks');
            frameworks = data.frameworks;
        }

        async function loadAds() {
            try {
                const url = IS_LOCAL
                    ? 'dev-fixture.json'
                    : `https://sheets.googleapis.com/v4/spreadsheets/${CONFIG.spreadsheetId}/values/${CONFIG.sheetName}!${CONFIG.range}?key=${CONFIG.apiKey}`;
                const response = await fetch(url, { cache: 'no-cache' });
                const data = await response.json();
                if (!response.ok || !data.values || data.values.length < 2) throw new Error('no rows');
                const headers = data.values[0];
                ads = data.values.slice(1).map((row, rowIndex) => {
                    const ad = {};
                    headers.forEach((header, index) => { ad[header] = row[index] || ''; });
                    ad._row = rowIndex + 2;
                    return ad;
                }).filter(ad => ad['Brand/Advertiser'] || ad['Ad Headline'] || ad['Ad Copy']);
            } catch (error) {
                console.error('Error loading ads:', error);
                ads = [];
                adsError = true;
            }
        }

        function mediaHtml(ad) {
            const rawVideoUrl = (ad['Video URL'] || '').trim();
            const imageUrl = safeUrl(ad['Image Preview'] || ad['Creative URL'] || '');
            const driveId = rawVideoUrl ? getGoogleDriveFileId(rawVideoUrl) : null;
            const title = escapeHtml((ad['Brand/Advertiser'] || 'Ad') + ' video');

            if (rawVideoUrl && driveId) {
                return `<iframe src="https://drive.google.com/file/d/${encodeURIComponent(driveId)}/preview" title="${title}" allow="autoplay" loading="lazy"></iframe>`;
            }
            if (rawVideoUrl && safeUrl(rawVideoUrl)) {
                return `<video preload="metadata" controls><source src="${safeUrl(rawVideoUrl)}" type="video/mp4">Your browser does not support video playback.</video>`;
            }
            if (imageUrl) {
                return `<img src="${imageUrl}" alt="${escapeHtml(ad['Ad Headline'] || ad['Brand/Advertiser'] || 'Ad creative')}" loading="lazy" onerror="retryImage(this)">`;
            }
            return '<div class="no-media">No creative saved for this ad</div>';
        }

        // Google throttles a burst of image requests, so a failed image is asked for again, a little later each time
        function retryImage(img) {
            const tries = Number(img.dataset.tries || 0);
            if (tries >= 4) { img.onerror = null; return; }
            img.dataset.tries = tries + 1;
            const src = img.src;
            setTimeout(() => { img.src = ''; img.src = src; }, 1200 * (tries + 1) + Math.random() * 800);
        }

        function capFirst(value) {
            const text = String(value == null ? '' : value);
            return text.charAt(0).toUpperCase() + text.slice(1);
        }

        function adHtml(ad) {
            const adLink = safeUrl(ad['Ad Link']);
            const transcript = (ad['Video Transcript'] || '').trim();
            const winnerNote = (ad['Winner Note'] || '').trim();
            return `
                <article class="ad">
                    <div class="ad-head">
                        <span class="ad-type">${mediaKind(ad) === 'video' ? 'Video' : 'Image'}</span>
                        <div class="ad-brand">${escapeHtml(ad['Brand/Advertiser'] || 'Unknown advertiser')}</div>
                        ${ad['Ad Headline'] ? `<div class="ad-headline">${escapeHtml(ad['Ad Headline'])}</div>` : ''}
                        ${isWinner(ad) ? `
                            <span class="winner-badge">🏆 Confirmed winner</span>
                            ${winnerNote ? `<div class="winner-note">${escapeHtml(winnerNote)}</div>` : ''}
                        ` : ''}
                    </div>
                    <div class="ad-media">${mediaHtml(ad)}</div>
                    <div class="ad-foot">
                        ${transcript ? `
                            <button class="transcript-toggle" aria-expanded="false" onclick="toggleTranscript(this)">Show transcript</button>
                            <div class="transcript">${escapeHtml(transcript)}</div>
                        ` : ''}
                        ${adLink ? `<div><a class="ad-link" href="${adLink}" target="_blank" rel="noopener noreferrer">View original ad</a></div>` : ''}
                    </div>
                </article>
            `;
        }

        function adsSectionHtml(framework) {
            if (adsError) return '<div class="empty">The ads could not be loaded right now. The beats above are still correct. Try again in a minute.</div>';
            if (ads === null) return '<div class="empty">Loading ads...</div>';
            const matched = adsFor(framework.number);
            if (!matched.length) {
                return mediaFilter === 'all'
                    ? '<div class="empty">No ads filed under this structure yet</div>'
                    : `<div class="empty">No ${mediaFilter} ads filed under this structure yet</div>`;
            }
            return `<div class="ads">${matched.map(adHtml).join('')}</div>`;
        }

        function bodyHtml(framework) {
            const beats = framework.beats || { headers: [], rows: [] };
            const facts = [
                ['Length', framework.length], ['Job', framework.job],
                ['Awareness', framework.awareness], ['Proof needed', framework.proof]
            ];
            return `
                <div class="facts">
                    ${facts.map(([label, value]) => `
                        <div class="fact">
                            <div class="fact-label">${label}</div>
                            <div class="fact-value">${richText(capFirst(value))}</div>
                        </div>
                    `).join('')}
                </div>

                <h3 class="section-title">The beats</h3>
                <div class="beats-scroll" tabindex="0" role="region" aria-label="Beats for ${escapeHtml(framework.title)}">
                    <table class="beats">
                        <thead><tr>${beats.headers.map(h => `<th scope="col">${richText(h)}</th>`).join('')}</tr></thead>
                        <tbody>
                            ${beats.rows.map(row => `<tr>${row.map(cell => `<td>${richText(cell)}</td>`).join('')}</tr>`).join('')}
                        </tbody>
                    </table>
                </div>
                ${framework.quotesHeld ? '<div class="held-note">Some quoted lines from the source ads are not shown for this structure.</div>' : ''}

                <h3 class="section-title">Ads built on this structure</h3>
                <div class="framework-ads">${adsSectionHtml(framework)}</div>
            `;
        }

        function render() {
            const container = document.getElementById('frameworks');
            if (!frameworks.length) {
                container.innerHTML = '<div class="status">No frameworks found</div>';
                return;
            }
            container.innerHTML = frameworks.map(framework => {
                const count = (ads && !adsError) ? adsFor(framework.number).length : null;
                return `
                    <section class="framework" id="${escapeHtml(framework.number)}" data-number="${escapeHtml(framework.number)}">
                        <button class="framework-toggle" aria-expanded="false" onclick="toggleFramework(this.parentElement.dataset.number)">
                            <span class="framework-number">${escapeHtml(framework.number)}</span>
                            <span class="framework-heading">
                                <div class="framework-title">${richText(framework.title)}</div>
                                <div class="framework-job">${richText(capFirst(framework.job))}</div>
                                <div class="framework-meta">
                                    <span class="chip">${richText(String(framework.length || '').split('(')[0].trim())}</span>
                                    ${count === null ? '' : `<span class="chip ads">${countLabel(count)}</span>`}
                                </div>
                            </span>
                            <span class="framework-chevron">▶</span>
                        </button>
                        <div class="framework-body"></div>
                    </section>
                `;
            }).join('');
        }

        // The body, with its videos, is only built when a framework is opened
        function toggleFramework(number, forceOpen) {
            const section = document.querySelector(`.framework[data-number="${CSS.escape(number)}"]`);
            const framework = frameworks.find(f => f.number === number);
            if (!section || !framework) return;
            const open = forceOpen === true ? true : !section.classList.contains('open');
            const body = section.querySelector('.framework-body');
            section.classList.toggle('open', open);
            section.querySelector('.framework-toggle').setAttribute('aria-expanded', open ? 'true' : 'false');
            body.innerHTML = open ? bodyHtml(framework) : '';
            if (open) history.replaceState(null, '', '#' + number);
            else if (location.hash === '#' + number) history.replaceState(null, '', location.pathname + location.search);
        }

        function toggleTranscript(button) {
            const body = button.nextElementSibling;
            const open = body.classList.toggle('open');
            button.setAttribute('aria-expanded', open ? 'true' : 'false');
            button.textContent = open ? 'Hide transcript' : 'Show transcript';
        }

        function openFromHash() {
            const number = decodeURIComponent(location.hash.replace('#', ''));
            if (!number || !frameworks.some(f => f.number === number)) return;
            toggleFramework(number, true);
            document.getElementById(number).scrollIntoView({ block: 'start' });
        }

        async function init() {
            try {
                await loadFrameworks();
            } catch (error) {
                console.error('Error loading frameworks:', error);
                document.getElementById('frameworks').innerHTML = '<div class="status">The frameworks could not be loaded. Try again in a minute.</div>';
                return;
            }
            await loadAds();
            render();
            openFromHash();
        }

        window.addEventListener('hashchange', openFromHash);
        init();
    </script>
</body>
</html>
